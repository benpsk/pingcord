# Every push to main: run CI, build the binary here (never on the server),
# copy it to the server and restart pingcord behind the host's Caddy.
# Server setup and the secrets/variables to add: deploy/README.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ vars.DEPLOY_GOARCH || 'amd64' }}
        run: make build VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: pingcord
          path: bin/pingcord
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pingcord
          path: release
      - name: Assemble release
        env:
          PINGCORD_DOMAIN: ${{ vars.PINGCORD_DOMAIN }}
        run: |
          if ! [[ "$PINGCORD_DOMAIN" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
            echo "::error::Set the PINGCORD_DOMAIN variable on the production environment (e.g. pingcord.example.com)"
            exit 1
          fi
          sed "s|{\$PINGCORD_DOMAIN}|$PINGCORD_DOMAIN|" deploy/pingcord.caddy > release/pingcord.caddy
          cp deploy/pingcord.service deploy/install.sh release/
          chmod 755 release/pingcord release/install.sh
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy the release
        run: |
          ssh "$SSH_TARGET" 'mkdir -p /opt/pingcord/release'
          scp -p release/* "$SSH_TARGET:/opt/pingcord/release/"
      - name: Install and restart
        run: ssh "$SSH_TARGET" 'bash /opt/pingcord/release/install.sh'
