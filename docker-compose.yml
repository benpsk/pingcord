# Optional: run pingcord in Docker instead of the systemd binary that
# deploy.yml installs. HTTPS comes from a reverse proxy on the host (Caddy,
# see deploy/pingcord.caddy), which reaches it on 127.0.0.1:8090.
#
#   cp .env.example .env   # fill it in
#   docker compose up -d

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  pingcord:
    build: .
    image: pingcord:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - pingcord-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    logging: *logging
    ports:
      - "127.0.0.1:8090:8080"

volumes:
  pingcord-data:
